<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz POO & UML</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b0f1a;--bg-card:#121826;--primary:#6366f1;--primary-light:#818cf8;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--text:#f1f5f9;--text-muted:#94a3b8;--border:#1e293b;--gradient:linear-gradient(135deg,#6366f1 0%,#a855f7 50%,#ec4899 100%);--radius:16px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% -20%,rgba(99,102,241,.25),transparent),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(168,85,247,.2),transparent);pointer-events:none;z-index:0}
    .container{max-width:1100px;margin:0 auto;padding:24px 20px 60px;position:relative;z-index:1}
    .header{text-align:center;margin-bottom:40px}
    .header h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(2rem,5vw,3.2rem);font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
    .header p{color:var(--text-muted);font-size:1.1rem;max-width:500px;margin:0 auto}
    .performance{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:36px}
    .performance h2{font-size:1rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
    .perf-empty{text-align:center;color:var(--text-muted);padding:12px;font-size:1.05rem}
    .provas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
    .prova-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;transition:all .3s;position:relative;overflow:hidden}
    .prova-card:hover{transform:translateY(-6px);border-color:rgba(99,102,241,.4);box-shadow:0 20px 40px rgba(99,102,241,.15)}
    .prova-card.completed{border-color:rgba(34,197,94,.3)}
    .prova-num{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:6px}
    .prova-info{color:var(--text-muted);font-size:.95rem;margin-bottom:20px}
    .prova-status{color:var(--success);font-weight:500;margin-bottom:12px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border:none;border-radius:12px;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .25s;width:100%}
    .btn-primary{background:var(--gradient);color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.35)}
    .btn-primary:hover{transform:translateY(-2px)}
    .btn-secondary{background:rgba(99,102,241,.15);color:var(--primary-light);border:1px solid rgba(99,102,241,.3)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .screen{display:none}.screen.active{display:block}
    .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .quiz-progress-text{font-weight:600;color:var(--text-muted);font-size:.95rem}
    .quiz-back{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:.9rem}
    .progress-bar-container{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:32px}
    .progress-bar{height:100%;background:var(--gradient);border-radius:99px;transition:width .4s}
    .question-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:32px 28px}
    .question-text{font-size:1.2rem;font-weight:500;margin-bottom:28px;line-height:1.6}
    .difficulty{display:inline-block;font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:99px;margin-bottom:16px;text-transform:uppercase}
    .diff-facil{background:rgba(34,197,94,.15);color:#4ade80}
    .diff-medio{background:rgba(245,158,11,.15);color:#fbbf24}
    .diff-dificil{background:rgba(239,68,68,.15);color:#f87171}
    .alternatives{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
    .alt-btn{background:rgba(30,41,59,.6);border:2px solid var(--border);border-radius:12px;padding:16px 20px;text-align:left;color:var(--text);font-size:1rem;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:14px}
    .alt-btn:hover{border-color:rgba(99,102,241,.5);background:rgba(99,102,241,.08)}
    .alt-btn.selected{border-color:var(--primary);background:rgba(99,102,241,.15);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
    .alt-letter{flex-shrink:0;width:32px;height:32px;border-radius:8px;background:rgba(99,102,241,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;color:var(--primary-light)}
    .alt-btn.selected .alt-letter{background:var(--primary);color:#fff}
    .quiz-actions{display:flex;justify-content:flex-end}
    .result-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:48px 32px;text-align:center;max-width:520px;margin:0 auto 40px}
    .result-card h2{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;margin-bottom:8px}
    .titulacao{font-size:1.6rem;font-weight:700;margin:24px 0;padding:16px 24px;border-radius:12px;display:inline-block}
    .titulacao.aura-maxima{background:linear-gradient(135deg,#fbbf24,#f59e0b,#d97706);color:#1a1a1a}
    .titulacao.aura-absurda{background:rgba(239,68,68,.2);color:#f87171}
    .titulacao.aura-insana{background:rgba(168,85,247,.2);color:#c084fc}
    .titulacao.aura-braba{background:rgba(59,130,246,.2);color:#60a5fa}
    .titulacao.aura-desenvolvimento{background:rgba(34,197,94,.15);color:#4ade80}
    .titulacao.aura-questionavel{background:rgba(245,158,11,.15);color:#fbbf24}
    .titulacao.aura-burro{background:rgba(100,116,139,.2);color:#94a3b8}
    .result-stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
    .stat{background:rgba(30,41,59,.5);border-radius:12px;padding:16px}
    .stat .label{font-size:.8rem;color:var(--text-muted);margin-bottom:4px}
    .stat .value{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700}
    .stat .value.nota{color:var(--primary-light)}.stat .value.acertos{color:var(--success)}.stat .value.erros{color:var(--danger)}.stat .value.perc{color:var(--warning)}
    .result-actions{display:flex;flex-direction:column;gap:12px;margin-top:28px}
    .funny-msg{margin-top:16px;font-size:.95rem;color:var(--text-muted);font-style:italic}
    .review-section{margin-top:10px}
    .review-section h3{font-family:'Space Grotesk',sans-serif;font-size:1.35rem;margin-bottom:20px;text-align:center}
    .review-item{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:14px}
    .review-item.correct{border-color:rgba(34,197,94,.35)}
    .review-item.wrong{border-color:rgba(239,68,68,.35)}
    .review-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
    .review-badge{flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700}
    .review-item.correct .review-badge{background:rgba(34,197,94,.2);color:#4ade80}
    .review-item.wrong .review-badge{background:rgba(239,68,68,.2);color:#f87171}
    .review-q{font-size:1rem;font-weight:500;line-height:1.5;flex:1}
    .review-answers{display:flex;flex-direction:column;gap:8px;margin-left:40px;font-size:.92rem}
    .review-ans{padding:8px 12px;border-radius:8px;background:rgba(30,41,59,.5)}
    .review-ans.user-correct{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
    .review-ans.user-wrong{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25);text-decoration:line-through}
    .review-ans.correct-one{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
    .review-ans .label{font-weight:600;margin-right:6px;opacity:.85}
    @media(max-width:600px){.container{padding:16px 14px 40px}.question-card{padding:24px 18px}.review-answers{margin-left:0}}
  </style>
</head>
<body>
  <div class="container">
    <div id="home" class="screen active">
      <div class="header">
        <h1>QUIZ POO & UML</h1>
        <p>Teste seus conhecimentos em Programação Orientada a Objetos e UML</p>
      </div>
      <div class="performance" id="performance-panel">
        <h2>📊 Seu Desempenho</h2>
        <div id="perf-content"></div>
      </div>
      <div class="provas-grid" id="provas-grid"></div>
    </div>
    <div id="quiz" class="screen">
      <div class="quiz-header">
        <button class="quiz-back" onclick="voltarHome()">← Voltar</button>
        <span class="quiz-progress-text" id="questao-num">Questão 1 de 20</span>
      </div>
      <div class="progress-bar-container"><div class="progress-bar" id="progress-bar" style="width:5%"></div></div>
      <div class="question-card" id="question-card">
        <span class="difficulty" id="diff-badge">Fácil</span>
        <div class="question-text" id="question-text"></div>
        <div class="alternatives" id="alternatives"></div>
        <div class="quiz-actions"><button class="btn btn-primary" id="btn-next" disabled onclick="proximaQuestao()">Próxima</button></div>
      </div>
    </div>
    <div id="result" class="screen">
      <div class="result-card" id="result-card">
        <h2>PROVA CONCLUÍDA!</h2>
        <div class="titulacao" id="titulacao"></div>
        <div class="result-stats">
          <div class="stat"><div class="label">Nota</div><div class="value nota" id="res-nota">0</div></div>
          <div class="stat"><div class="label">Aproveitamento</div><div class="value perc" id="res-perc">0%</div></div>
          <div class="stat"><div class="label">Acertos</div><div class="value acertos" id="res-acertos">0 / 20</div></div>
          <div class="stat"><div class="label">Erros</div><div class="value erros" id="res-erros">0 / 20</div></div>
        </div>
        <p class="funny-msg" id="funny-msg"></p>
        <div class="result-actions">
          <button class="btn btn-primary" onclick="refazerProva()">Fazer Novamente</button>
          <button class="btn btn-secondary" onclick="voltarHome()">Voltar às Provas</button>
        </div>
      </div>
      <div class="review-section" id="review-section">
        <h3>📋 Resultado de todas as questões</h3>
        <div id="review-list"></div>
      </div>
    </div>
  </div>
  <script>
    const provas = {
      1: [
        {q:"O que é um objeto em Programação Orientada a Objetos?",a:["Uma variável global do sistema","Uma instância de uma classe que possui estado e comportamento","Um tipo de dado primitivo","Uma função que retorna valores"],c:1,d:"facil"},
        {q:"Qual princípio de POO permite ocultar os detalhes internos de implementação de uma classe?",a:["Herança","Polimorfismo","Encapsulamento","Abstração"],c:2,d:"facil"},
        {q:"Em UML, qual diagrama é usado para modelar a estrutura estática de um sistema mostrando classes e seus relacionamentos?",a:["Diagrama de Sequência","Diagrama de Casos de Uso","Diagrama de Classes","Diagrama de Atividades"],c:2,d:"facil"},
        {q:"O que significa a multiplicidade 1..* em um relacionamento UML?",a:["Exatamente um","Zero ou um","Um ou mais","Zero ou mais"],c:2,d:"facil"},
        {q:"Qual modificador de visibilidade em UML é representado pelo símbolo '-' (hífen)?",a:["public","protected","private","package"],c:2,d:"facil"},
        {q:"Herança em POO permite que uma classe:",a:["Tenha apenas métodos estáticos","Herde atributos e métodos de outra classe","Seja instanciada várias vezes","Não tenha construtor"],c:1,d:"facil"},
        {q:"O que é polimorfismo?",a:["A capacidade de uma classe ter vários construtores","A capacidade de objetos de diferentes classes responderem à mesma mensagem de formas diferentes","A ocultação de dados","A criação de interfaces"],c:1,d:"medio"},
        {q:"Qual a diferença entre agregação e composição em UML?",a:["Não há diferença","Na composição o todo não existe sem as partes, na agregação existe","Na agregação o todo não existe sem as partes","Ambas são o mesmo que herança"],c:1,d:"medio"},
        {q:"Uma classe abstrata:",a:["Pode ser instanciada normalmente","Não pode ser instanciada e pode ter métodos abstratos","Só pode ter métodos estáticos","É a mesma coisa que interface"],c:1,d:"medio"},
        {q:"O que representa o diagrama de sequência em UML?",a:["A estrutura estática das classes","A interação entre objetos ao longo do tempo","Os casos de uso do sistema","Os estados de um objeto"],c:1,d:"medio"},
        {q:"Encapsulamento tem como objetivo principal:",a:["Permitir herança múltipla","Proteger os dados internos e controlar o acesso a eles","Criar muitas classes","Eliminar a necessidade de métodos"],c:1,d:"facil"},
        {q:"Em UML, o símbolo + representa:",a:["private","protected","public","package"],c:2,d:"facil"},
        {q:"O que é uma interface em POO?",a:["Uma classe concreta","Um contrato que define métodos que uma classe deve implementar","Um tipo de herança","Um atributo estático"],c:1,d:"medio"},
        {q:"Associação em UML representa:",a:["Herança entre classes","Um relacionamento estrutural entre classes","A implementação de interface","Um método abstrato"],c:1,d:"medio"},
        {q:"O que significa a multiplicidade 0..1?",a:["Obrigatório um","Opcional (zero ou um)","Um ou mais","Muitos"],c:1,d:"facil"},
        {q:"Classes abstratas e interfaces têm em comum:",a:["Podem ser instanciadas","Não podem ser instanciadas diretamente","Só existem em Java","Não têm métodos"],c:1,d:"medio"},
        {q:"O diagrama de casos de uso é usado principalmente para:",a:["Mostrar a estrutura de classes","Capturar os requisitos funcionais do sistema do ponto de vista do usuário","Mostrar a sequência de mensagens","Definir atributos privados"],c:1,d:"facil"},
        {q:"Polimorfismo de inclusão (ou de subtipo) ocorre quando:",a:["Uma classe tem vários métodos com o mesmo nome","Uma referência de superclasse aponta para um objeto de subclasse","Há sobrecarga de operadores","Se usa interface"],c:1,d:"dificil"},
        {q:"Em composição, quando o objeto todo é destruído:",a:["As partes continuam existindo","As partes também são destruídas","Nada acontece","Apenas os atributos são apagados"],c:1,d:"medio"},
        {q:"O que é abstração em POO?",a:["Esconder a complexidade e mostrar apenas o essencial","Criar muitas classes","Usar apenas métodos privados","Fazer herança múltipla"],c:0,d:"facil"}
      ],
      2: [], 3: [], 4: [], 5: []
    };

    let currentProva = 1, currentQuestao = 0, respostas = [], selectedAlt = null;
    const STORAGE_KEY = 'quizPooUml';

    function loadProgress() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
    }
    function saveProgress(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    function getNota(id) { return loadProgress()['prova'+id] ?? null; }
    function setNota(id, nota) {
      const p = loadProgress();
      p['prova'+id] = nota;
      saveProgress(p);
    }
    function getTitulacao(nota) {
      if (nota === 10) return {texto:'👑 AURA MÁXIMA', classe:'aura-maxima'};
      if (nota >= 9) return {texto:'🔥 AURA ABSURDA', classe:'aura-absurda'};
      if (nota >= 8) return {texto:'⚡ AURA INSANA', classe:'aura-insana'};
      if (nota >= 7) return {texto:'😎 AURA BRABA', classe:'aura-braba'};
      if (nota >= 6) return {texto:'📚 AURA EM DESENVOLVIMENTO', classe:'aura-desenvolvimento'};
      if (nota >= 5.1) return {texto:'🫡 AURA QUESTIONÁVEL', classe:'aura-questionavel'};
      return {texto:'🤡 MT BURRO KKKK', classe:'aura-burro'};
    }
    function getFunnyMsg(nota) {
      if (nota === 10) return 'Perfeito! Você é o rei da POO e UML!';
      if (nota >= 9) return 'Quase perfeito, absurdo demais!';
      if (nota >= 8) return 'Muito bem, aura insana!';
      if (nota >= 7) return 'Boa! Continua assim.';
      if (nota >= 6) return 'Tá no caminho, estuda mais um pouco.';
      if (nota >= 5.1) return 'Hmm... precisa revisar uns conceitos.';
      return 'Vish... melhor estudar de novo kkkkk';
    }

    function renderHome() {
      const p = loadProgress();
      const notas = [1,2,3,4,5].map(i => getNota(i)).filter(n => n !== null);
      const perf = document.getElementById('perf-content');
      if (notas.length === 0) {
        perf.innerHTML = '<div class="perf-empty">Você ainda não realizou nenhuma prova. Bora começar? 👀</div>';
      } else {
        const media = (notas.reduce((a,b)=>a+b,0)/notas.length).toFixed(1).replace('.',',');
        const melhor = Math.max(...notas).toFixed(1).replace('.',',');
        const tit = getTitulacao(Math.max(...notas));
        perf.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;text-align:center">
          <div><div style="font-size:.8rem;color:var(--text-muted)">Provas</div><div style="font-size:1.3rem;font-weight:700;color:var(--primary-light)">${notas.length}/5</div></div>
          <div><div style="font-size:.8rem;color:var(--text-muted)">Média</div><div style="font-size:1.3rem;font-weight:700;color:var(--primary-light)">${media}/10</div></div>
          <div><div style="font-size:.8rem;color:var(--text-muted)">Melhor</div><div style="font-size:1.3rem;font-weight:700;color:var(--primary-light)">${melhor}/10</div></div>
          <div><div style="font-size:.8rem;color:var(--text-muted)">Titulação</div><div style="font-size:1rem;font-weight:700">${tit.texto}</div></div>
        </div>`;
      }
      let html = '';
      for (let i = 1; i <= 5; i++) {
        const nota = getNota(i);
        const temQuestoes = provas[i] && provas[i].length === 20;
        if (nota !== null) {
          html += `<div class="prova-card completed"><div class="prova-num">PROVA ${i}</div><div class="prova-status">✅ Concluída</div><div class="prova-info">Nota: ${nota.toFixed(1).replace('.',',')}/10</div><button class="btn btn-secondary" onclick="iniciarProva(${i})">${temQuestoes ? 'FAZER NOVAMENTE' : 'EM BREVE'}</button></div>`;
        } else {
          html += `<div class="prova-card"><div class="prova-num">PROVA ${i}</div><div class="prova-info">20 questões</div><button class="btn btn-primary" onclick="iniciarProva(${i})">${temQuestoes ? 'COMEÇAR PROVA' : 'EM BREVE'}</button></div>`;
        }
      }
      document.getElementById('provas-grid').innerHTML = html;
    }

    function iniciarProva(id) {
      if (!provas[id] || provas[id].length < 20) {
        alert('As questões desta prova ainda estão sendo restauradas. Por enquanto só a Prova 1 está completa!');
        return;
      }
      currentProva = id;
      currentQuestao = 0;
      respostas = new Array(20).fill(null);
      selectedAlt = null;
      showScreen('quiz');
      renderQuestao();
    }

    function renderQuestao() {
      const q = provas[currentProva][currentQuestao];
      document.getElementById('questao-num').textContent = `Questão ${currentQuestao+1} de 20`;
      document.getElementById('progress-bar').style.width = ((currentQuestao+1)/20*100) + '%';
      document.getElementById('diff-badge').textContent = q.d === 'facil' ? 'Fácil' : q.d === 'medio' ? 'Médio' : 'Difícil';
      document.getElementById('diff-badge').className = 'difficulty diff-' + q.d;
      document.getElementById('question-text').textContent = q.q;
      const alts = document.getElementById('alternatives');
      alts.innerHTML = '';
      const letras = ['A','B','C','D'];
      q.a.forEach((txt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'alt-btn' + (respostas[currentQuestao] === idx ? ' selected' : '');
        btn.innerHTML = `<span class="alt-letter">${letras[idx]}</span><span>${txt}</span>`;
        btn.onclick = () => selecionarAlt(idx);
        alts.appendChild(btn);
      });
      selectedAlt = respostas[currentQuestao];
      const btnNext = document.getElementById('btn-next');
      btnNext.disabled = selectedAlt === null;
      btnNext.textContent = currentQuestao === 19 ? 'Finalizar prova' : 'Próxima';
    }

    function selecionarAlt(idx) {
      selectedAlt = idx;
      respostas[currentQuestao] = idx;
      document.querySelectorAll('.alt-btn').forEach((b,i) => b.classList.toggle('selected', i === idx));
      document.getElementById('btn-next').disabled = false;
    }

    function proximaQuestao() {
      if (selectedAlt === null) return;
      if (currentQuestao < 19) {
        currentQuestao++;
        selectedAlt = respostas[currentQuestao];
        renderQuestao();
      } else {
        finalizarProva();
      }
    }

    function finalizarProva() {
      let acertos = 0;
      provas[currentProva].forEach((q,i) => { if (respostas[i] === q.c) acertos++; });
      const nota = Math.round((acertos/20)*10 * 10) / 10;
      setNota(currentProva, nota);
      document.getElementById('res-nota').textContent = nota.toFixed(1).replace('.',',') + ' / 10';
      document.getElementById('res-acertos').textContent = acertos + ' / 20';
      document.getElementById('res-erros').textContent = (20-acertos) + ' / 20';
      document.getElementById('res-perc').textContent = Math.round(acertos/20*100) + '%';
      const tit = getTitulacao(nota);
      const titEl = document.getElementById('titulacao');
      titEl.textContent = tit.texto;
      titEl.className = 'titulacao ' + tit.classe;
      document.getElementById('funny-msg').textContent = getFunnyMsg(nota);

      const letras = ['A','B','C','D'];
      let reviewHtml = '';
      provas[currentProva].forEach((q,i) => {
        const userAns = respostas[i];
        const isCorrect = userAns === q.c;
        const userText = userAns != null ? q.a[userAns] : 'Não respondida';
        reviewHtml += `<div class="review-item ${isCorrect?'correct':'wrong'}">
          <div class="review-header"><div class="review-badge">${isCorrect?'✅':'❌'}</div>
          <div class="review-q"><strong>Questão ${i+1}:</strong> ${q.q}</div></div>
          <div class="review-answers">
            ${isCorrect
              ? `<div class="review-ans user-correct"><span class="label">Sua resposta:</span> ${letras[userAns]}) ${userText}</div>`
              : `<div class="review-ans user-wrong"><span class="label">Sua resposta:</span> ${userAns!=null ? letras[userAns]+') '+userText : userText}</div>
                 <div class="review-ans correct-one"><span class="label">Resposta correta:</span> ${letras[q.c]}) ${q.a[q.c]}</div>`}
          </div></div>`;
      });
      document.getElementById('review-list').innerHTML = reviewHtml;
      showScreen('result');
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function refazerProva() { iniciarProva(currentProva); }
    function voltarHome() { showScreen('home'); renderHome(); }
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
    renderHome();
  </script>
</body>
</html>
