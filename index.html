<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz POO & UML</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f1a;
      --bg-card: #121826;
      --bg-card-hover: #1a2336;
      --primary: #6366f1;
      --primary-light: #818cf8;
      --primary-dark: #4f46e5;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --shadow: 0 10px 40px rgba(0,0,0,0.4);
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; overflow-x: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 50% at 20% -20%, rgba(99,102,241,0.25), transparent), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(168,85,247,0.2), transparent); pointer-events: none; z-index: 0; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; position: relative; z-index: 1; }
    .header { text-align: center; margin-bottom: 40px; }
    .header h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 12px; }
    .header p { color: var(--text-muted); font-size: 1.1rem; max-width: 500px; margin: 0 auto; }
    .performance { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 36px; box-shadow: var(--shadow); }
    .performance h2 { font-size: 1rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px; }
    .perf-empty { text-align: center; color: var(--text-muted); padding: 12px; font-size: 1.05rem; }
    .provas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .prova-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 24px; transition: all 0.3s; position: relative; overflow: hidden; }
    .prova-card:hover { transform: translateY(-6px); border-color: rgba(99,102,241,0.4); box-shadow: 0 20px 40px rgba(99,102,241,0.15); }
    .prova-num { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
    .prova-info { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border: none; border-radius: 12px; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.25s ease; width: 100%; }
    .btn-primary { background: var(--gradient); color: white; box-shadow: 0 4px 20px rgba(99,102,241,0.35); }
    .btn-primary:hover { transform: translateY(-2px); }
    .screen { display: none; }
    .screen.active { display: block; }
    @media (max-width: 600px) { .container { padding: 16px 14px 40px; } }
  </style>
</head>
<body>
  <div class="container">
    <div id="home" class="screen active">
      <div class="header">
        <h1>QUIZ POO & UML</h1>
        <p>Teste seus conhecimentos em Programação Orientada a Objetos e UML</p>
      </div>
      <div class="performance" id="performance-panel">
        <h2>📊 Seu Desempenho</h2>
        <div id="perf-content"><div class="perf-empty">Você ainda não realizou nenhuma prova. Bora começar? 👀</div></div>
      </div>
      <div class="provas-grid" id="provas-grid"></div>
    </div>
  </div>
  <script>
    const provas = {1: [], 2: [], 3: [], 4: [], 5: []};
    function renderHome() {
      const grid = document.getElementById('provas-grid');
      let html = '';
      for (let i = 1; i <= 5; i++) {
        html += `<div class="prova-card"><div class="prova-num">PROVA ${i}</div><div class="prova-info">20 questões</div><button class="btn btn-primary" onclick="alert('O arquivo completo com as 100 questões ainda está sendo restaurado. Em breve!')">COMEÇAR PROVA</button></div>`;
      }
      grid.innerHTML = html;
    }
    renderHome();
  </script>
</body>
</html>
